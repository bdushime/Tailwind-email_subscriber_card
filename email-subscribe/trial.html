<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Document</title>
</head>
<body>
    <div class="bg-zinc-800 flex items-center justify-center h-screen">
        <!--Card-->
      <div class="bg-zinc-900 p-6 mx-6 rounded-2xl shadow-lg ">
        <!--container-->
        <div class="flex flex-col md:flex-row">
            <!--Image-->
            <img src="./images/image.jpg" class="h-80 md:h-64  rounded-l-xl md:rounded-2xl" alt="">
            <h1 class="text-white font-serif text-xl mx-2 my-2 font-bold">Get diet and fitness tips in your inbox</h1>
            <p class="text-white text-xs">Eat better and exercise better. Sign up for the Diet & Fitness newsletter</p>
            <div class="flex flex-col md:flex-row m-2">
                <input class="p-2 px-4 text-center text-white bg-zinc-800 rounded-2xl" type="text" placeholder="Enter your email">
                <button class="mt-5 p-3 px-4 bg-green-300 rounded-2xl md:rounded-2xl">Subscribe</button>

            </div>
        </div>
      </div>

    </div>
    
</body>
</html>
