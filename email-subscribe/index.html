<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Email Subscribe</title>
</head>
<body>
    <!-- Background Container -->
    <div class="flex items-center justify-center h-screen bg-zinc-700">
        <!-- Card -->
        <div class="bg-zinc-800 p-6 mx-6 rounded-2xl shadow-lg">
            <!-- Flex Container -->
            <div class="flex flex-col md:flex-row rounded-xl">
                <!-- Image -->
                <img src="images/image.jpg" alt="Fitness Tips" class="object-cover w-full rounded-t-xl h-64 md:h-auto md:w-1/2 md:rounded-l-xl md:rounded-tr-none transform hover:scale-105 duration-300"/>

                <!-- Content -->
                <div class="p-6 md:p-8 flex flex-col justify-center">
                    <h2 class="font-serif text-2xl font-semibold text-center text-white md:text-left">
                        Get diet and fitness tips in your inbox
                    </h2>
                    <p class="max-w-md mt-4 text-sm leading-6 tracking-wide text-center text-gray-300 md:text-left">
                        Eat better and exercise better. Sign up for the Diet & Fitness newsletter.
                    </p>

                    <!-- Input and Button -->
                    <div class="flex flex-col mt-6 space-y-4 md:flex-row md:space-y-0 md:space-x-4">
                        <input 
                            type="text" 
                            placeholder="Enter your email address" 
                            class="p-3 text-sm text-gray-200 placeholder-gray-400 bg-zinc-900 border border-zinc-600 rounded-md focus:outline-none focus:ring-2 focus:ring-lime-500 w-full md:w-2/3"
                        >
                        <button 
                            class="px-6 py-3 text-sm font-medium text-white bg-lime-500 rounded-md hover:bg-lime-600 focus:outline-none focus:ring-2 focus:ring-lime-500">
                            Subscribe
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
