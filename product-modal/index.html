<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Product modal</title>
</head>
<body>
    <!--Global container-->
    <div class="flex items-center justify-center bg-lime-500 h-screen">
     
      <!--Outer Container-->
      
      <div class="flex flex-col md:flex-row bg-zinc-600 px-4 py-3 mx-3 my-2">
        <!--Inner Container-->
        <div class="flex flex-row">
            <!--First Container-->
            <div class="flex items-center justify-center px-2 py-2 " >
                <img src="../email-subscribe/images/image6.jpg" >
            </div>
            <!--Second Container-->
            <div class="flex flex-col  px-2 py-3 flex-grow">
                <div class="flex justify-center w-34 text-white bg-black rounded-2xl px-2 py-2">Free shipping</div>
                <h2 class="mt-2 text-xl font-medium">Razer Kraken Kitty Edt Gaming Headset Quartz</h2>
                <p class="mt-3 font-serif">$799</p>
                <div class=" flex font-bold text-5xl mt-2  justify-center">$599</div>
                <p class="text-zinc-800">The offer is valid until April 3 or as long as stock lasts</p>
                <div class="flex justify-center w-34 text-white bg-blue-500 rounded-xl px-2 py-2 border-b-4">Add to cart</div>
                <div></div>

            </div>
        </div>
      </div>

    </div>
</body>
</html>
