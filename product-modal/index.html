<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Product modal</title>
</head>
<body>
    <!--Global container-->
    <div class="flex items-center justify-center  h-screen">
     
      <!--Outer Container-->
      
      <div class="flex flex-col p-6 m-3 space-y-10 bg-white rounded-2xl shadow-2xl shadow-2xl md:flex-row md:space-y-0 md:space-x-10 md:m-0 md:p-16">
        <!--Inner Container-->
        <div class="flex flex-col  md:flex-row space-x-3 mx-4">
            <!--First Container-->
            <div >
                <img src="../email-subscribe/images/headphone.png" class="mx-auto w-60">
            </div>
            <!--Second Container-->
            <div class="flex flex-col text-center justify-center md:text-left px-2 py-3 flex-grow">
                <div><div class="inline-block  justify-center  text-white bg-black rounded-full px-3 py-1">Free shipping</div></div>
                <h2 class="mt-2 text-xl font-medium">Razer Kraken Kitty Edt Gaming Headset Quartz</h2>
                <p class="mt-3 font-serif line-through">$799</p>
                <p class=" font-bold text-5xl mt-2  text-center">$599</p>
                <p class="text-zinc-800">The offer is valid until April 3 or as long as stock lasts</p>
                <div class="group">
                    <button class="w-full">
                        <div class="flex justify-center w-34 text-white bg-blue-500 rounded-xl px-2 py-2 border-b-4 mt-5 hover:scale-105 duration-500">Add to cart</div>
                    </button>
                </div>
              
                
            <!--sub-container 1-->
                <div class="flex flex-row mt-5 space-x-3 items-center">
                    <div class="w-3 h-3 bg-green-400 hover:animate-ping rounded-full"></div>
                      <div class="font-medium">50+ pcs. in stock.</div>
                </div>

                <!--sub container 2-->
                <div class="flex flex-col md:flex-row gap-2">
                    <div class="flex flex-row border border-gray-500 mt-3 px-2 py-2 hover:bg-lime-500 hover:scale-105 duration-500 space-x-3 rounded-lg">
                       <img class="h-8 " src="../email-subscribe/images/weight.png">
                      <p>Add to cart</p>    
                    </div>


                    <div class="flex flex-row border border-gray-500 mt-3 px-2 py-2 hover:bg-lime-500 hover:scale-105 duration-500 space-x-3 rounded-lg">
                        <img class="h-8 " src="../email-subscribe/images/heart.png">
                       <p>Add to cart</p>    
                     </div>
                </div>


            </div>
        </div>
      </div>

    </div>
</body>
</html>
