<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Product modal</title>
</head>
<body>
    <!--Global container-->
    <div class="flex items-center justify-center  h-screen">
     
      <!--Outer Container-->
      
      <div class="flex flex-col md:flex-row bg-gray-300 rounded-2xl shadow-2xl px-4 py-3 mx-3 my-2 space-x-10">
        <!--Inner Container-->
        <div class="flex flex-row">
            <!--First Container-->
            <div >
                <img src="../email-subscribe/images/headphone.png" class="mx-auto w-60">
            </div>
            <!--Second Container-->
            <div class="flex flex-col  justify-center px-2 py-3 flex-grow">
                <div><div class="inline-block  justify-center  text-white bg-black rounded-full px-3 py-1">Free shipping</div></div>
                <h2 class="mt-2 text-xl font-medium">Razer Kraken Kitty Edt Gaming Headset Quartz</h2>
                <p class="mt-3 font-serif line-through">$799</p>
                <div class=" flex font-bold text-5xl mt-2  ">$599</div>
                <p class="text-zinc-800">The offer is valid until April 3 or as long as stock lasts</p>
                <div class="flex justify-center w-34 text-white bg-blue-500 rounded-xl px-2 py-2 border-b-4 mt-5 hover:scale-105 duration-500">Add to cart</div>
            <!--sub-container 1-->
                <div class="flex flex-row mt-5">
                    <svg xmlns="http://www.w3.org/2000/svg" class="icon icon-tabler icon-tabler-bookmark" width="28" height="28" viewBox="0 0 24 24" stroke-width="1.2" stroke="#ffffff" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
                        <path d="M9 4h6a2 2 0 0 1 2 2v14l-5 -3l-5 3v-14a2 2 0 0 1 2 -2" />
                      </svg>
                      
                      <p class="font-medium">50+ pcs. in stock.</p>
                </div>

                <!--sub container 2-->
                <div class="flex flex-row gap-4">
                    <div class="flex flex-row border border-violet-200 mt-3 px-2 py-2 hover:bg-lime-500 hover:scale-105 duration-500">
                        <svg xmlns="http://www.w3.org/2000/svg" class="icon icon-tabler icon-tabler-bookmark" width="28" height="28" viewBox="0 0 24 24" stroke-width="1.2" stroke="#ffffff" fill="none" stroke-linecap="round" stroke-linejoin="round">
                            <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
                            <path d="M9 4h6a2 2 0 0 1 2 2v14l-5 -3l-5 3v-14a2 2 0 0 1 2 -2" />
                          </svg>
                      <p>Add to cart</p>    
                    </div>


                    <div class="flex flex-row border border-violet-200 mt-3 px-2 py-2 hover:bg-lime-500 hover:scale-105 duration-500">
                        <svg xmlns="http://www.w3.org/2000/svg" class="icon icon-tabler icon-tabler-bookmark" width="28" height="28" viewBox="0 0 24 24" stroke-width="1.2" stroke="#ffffff" fill="none" stroke-linecap="round" stroke-linejoin="round">
                            <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
                            <path d="M9 4h6a2 2 0 0 1 2 2v14l-5 -3l-5 3v-14a2 2 0 0 1 2 -2" />
                          </svg>
                      <p>Add to cart</p>    
                    </div>
                </div>


            </div>
        </div>
      </div>

    </div>
</body>
</html>
